services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-server-2022
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SqlDocker2026
    volumes:
      - ./SQLCreateTablesBc.sql:/usr/src/app/SQLCreateTablesBc.sql:ro,z
    # Tento command nahrazuje starý entrypoint.sh
    command: >
      /bin/bash -c "
        /opt/mssql/bin/sqlservr &
        echo 'Cekam 30s na start SQL Serveru...' &&
        sleep 30s &&
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SqlDocker2026' -i /usr/src/app/SQLCreateTablesBc.sql -C &&
        echo 'Tabulky a uzivatele zkontrolovani/vytvoreni.' &&
        wait
      "
    restart: always
