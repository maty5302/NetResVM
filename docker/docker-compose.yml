services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-server-2022

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mssql_data:/var/opt/mssql
    command: >
      /bin/bash -c "
        /opt/mssql/bin/sqlservr &
        echo 'Waiting for SQL Server startup...' &&
        sleep 30s &&
        echo 'Downloading SQL script from GitHub...' &&
        wget -O /tmp/init.sql https://raw.githubusercontent.com/maty5302/NetResVM/dev/assets/SQLCreateTablesBc.sql &&
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD}' -i /tmp/init.sql -C &&
        echo 'Database initialized.' &&
        wait
      "

    restart: always

  # One-shot helper: the app runs as non-root user 'app' (UID 1654), but Docker creates
  # bind-mounted folders (./backups, ./logs) as root and an older dp-keys volume may be root-owned.
  # This fixes ownership before the app starts, so backups, logs and Data Protection keys can be written.
  init-permissions:
    image: busybox:1.36
    container_name: netresvm-init-permissions
    user: "0:0"
    command: ["sh", "-c", "chown -R 1654:1654 /app/keys /app/backups /app/logs || echo 'WARNING: chown failed, check folder permissions'"]
    volumes:
      - dp-keys:/app/keys
      - ./backups:/app/backups
      - ./logs:/app/logs
    restart: "no"

  netresvm:
    image: ghcr.io/maty5302/netresvm:latest # Use the latest image from GitHub Container Registry or dev branch for testing
    container_name: netresvm-app

    depends_on:
      mssql:
        condition: service_started
      init-permissions:
        condition: service_completed_successfully

    ports:
      - "8080:8080"
      - "127.0.0.1:2323:2323"

    environment:
        - ConnectionStrings__DefaultConnection=Server=mssql;Database=DB_NetResVM;User Id=${DB_USER};Password=${DB_PASSWORD};Encrypt=False;TrustServerCertificate=True;
        - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - dp-keys:/app/keys
      - ./backups:/app/backups
      - ./logs:/app/logs

    restart: always

volumes:
  mssql_data:
  dp-keys:
